<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TijarahJo — Jordan's trusted marketplace for buying and selling new and used items with confidence. Browse thousands of listings across all governorates."
    />
    <meta http-equiv="Content-Security-Policy" content="__CSP_POLICY__" />
    <script>
      try{var t=localStorage.getItem("tijarahjo_dark_mode"),v=t===null?null:JSON.parse(t),d=v===true||v==="dark",l=localStorage.getItem("tijarahjo_language"),n=l===null?"ar":JSON.parse(l);document.documentElement.classList.toggle("dark",d);document.documentElement.lang=n==="en"?"en":"ar";document.documentElement.dir=n==="en"?"ltr":"rtl"}catch(e){document.documentElement.classList.remove("dark");document.documentElement.lang="ar";document.documentElement.dir="rtl"}
    </script>
    <title>TijarahJo - Jordan's Marketplace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
