<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TijarahJo — Jordan's trusted marketplace for buying and selling new and used items with confidence. Browse thousands of listings across all governorates."
    />
    <meta http-equiv="Content-Security-Policy" content="__CSP_POLICY__" />
    <script>
      // Inline theme init — prevents FOUC while avoiding render-blocking network request
      try{var r=localStorage.getItem("tijarahjo_dark_mode"),v=r===null?null:JSON.parse(r),d=v===true||v==="dark";document.documentElement.classList.toggle("dark",d);document.documentElement.style.colorScheme=d?"dark":"light"}catch(e){document.documentElement.classList.remove("dark");document.documentElement.style.colorScheme="light"}
    </script>
    <title>TijarahJo - Jordan's Marketplace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
  </body>
</html>
