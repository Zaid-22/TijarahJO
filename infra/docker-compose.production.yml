# Run from repo root: ./scripts/compose-production.sh up -d --build
# Or: set -a && source .env && set +a && docker compose -f infra/docker-compose.production.yml ...
# Do not pass --project-directory . — build context ".." is resolved from the project dir and breaks (lstat /opt/apps).
services:
  sqlserver:
    container_name: tijarahjo-db
    ports:
      - "1433:1433"
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}
    volumes:
      - mssql_data:/var/opt/mssql
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - backend
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    container_name: tijarahjo-redis
    image: redis:alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping)\" = \"PONG\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    container_name: tijarahjo-api
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      FrontendUrl: ${FRONTEND_URL:?Set FRONTEND_URL}
      CORS__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      # AllowedHosts must be semicolon-separated (ASP.NET host filtering)
      AllowedHosts: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS}
      DATABASE_CONNECTION_STRING: "Server=sqlserver,1433;Database=TijarahJoDB;User Id=${DB_APP_LOGIN:?Set DB_APP_LOGIN};Password=${DB_APP_PASSWORD:?Set DB_APP_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      FileStorage__RootPath: /var/lib/tijarahjo/uploads
      FileStorage__PublicBasePath: /uploads
      FeatureFlags__EnableAiComparison: "true"
      FeatureFlags__RequireRedis: "true"
      FeatureFlags__EnableRateLimiting: ${FeatureFlags__EnableRateLimiting:-false}
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-true}
      GOOGLE_AUTH_CLIENT_ID: ${GOOGLE_AUTH_CLIENT_ID:?Set GOOGLE_AUTH_CLIENT_ID}
      GOOGLE_AUTH_CLIENT_SECRET: ${GOOGLE_AUTH_CLIENT_SECRET:?Set GOOGLE_AUTH_CLIENT_SECRET}
      GOOGLE_AUTH_REDIRECT_URI: ${GOOGLE_AUTH_REDIRECT_URI:-https://tijarahjo.online/api/v1/auth/google/callback}
      GOOGLE_AUTH_FRONTEND_SUCCESS_URL: ${GOOGLE_AUTH_FRONTEND_SUCCESS_URL:-https://tijarahjo.online/}
      GOOGLE_AUTH_FRONTEND_FAILURE_URL: ${GOOGLE_AUTH_FRONTEND_FAILURE_URL:-https://tijarahjo.online/login}
      EmailTwoFactor__Enabled: ${EmailTwoFactor__Enabled:-false}
      EmailTwoFactor__ResendApiKey: ${EmailTwoFactor__ResendApiKey:-}
      EmailTwoFactor__FromAddress: ${EmailTwoFactor__FromAddress:-security@tijarahjo.online}
      EmailTwoFactor__FromName: ${EmailTwoFactor__FromName:-TijarahJo Security}
      EmailTwoFactor__LogCodesWhenEmailDisabled: ${EmailTwoFactor__LogCodesWhenEmailDisabled:-false}
      PasswordResetEmail__Enabled: ${PasswordResetEmail__Enabled:-false}
      PasswordResetEmail__ResendApiKey: ${PasswordResetEmail__ResendApiKey:-}
      PasswordResetEmail__FromAddress: ${PasswordResetEmail__FromAddress:-security@tijarahjo.online}
      PasswordResetEmail__FromName: ${PasswordResetEmail__FromName:-TijarahJo Security}
      PasswordResetEmail__LogCodesWhenEmailDisabled: ${PasswordResetEmail__LogCodesWhenEmailDisabled:-false}
      EmailVerification__Enabled: ${EmailVerification__Enabled:-false}
      EmailVerification__ResendApiKey: ${EmailVerification__ResendApiKey:-}
      EmailVerification__FromAddress: ${EmailVerification__FromAddress:-security@tijarahjo.online}
      EmailVerification__FromName: ${EmailVerification__FromName:-TijarahJo}
      EmailVerification__LogTokensWhenEmailDisabled: ${EmailVerification__LogTokensWhenEmailDisabled:-false}
      Gemini__ApiKey: ${Gemini__ApiKey:?Set Gemini__ApiKey}
      YouTube__ApiKey: ${YouTube__ApiKey:?Set YouTube__ApiKey}
      YouTube__Referer: ${YouTube__Referer:?Set YouTube__Referer}
      TwoFactor__SecretEncryptionKey: ${TwoFactor__SecretEncryptionKey:?Set TwoFactor__SecretEncryptionKey}
      TwoFactor__ChallengeSigningKey: ${TwoFactor__ChallengeSigningKey:?Set TwoFactor__ChallengeSigningKey}
      # Google Cloud Vision (safe-search moderation for chat/post/profile image uploads)
      ImageModeration__Enabled: ${ImageModeration__Enabled:-false}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-vision.json
      ForwardedHeaders__KnownNetworks__0: "172.16.0.0/12"
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - frontend
      - backend
    volumes:
      - api_uploads:/var/lib/tijarahjo/uploads
      - ${GCP_VISION_CREDENTIALS_FILE:-/opt/tijarahjo/secrets/gcp-vision-sa.json}:/run/secrets/gcp-vision.json:ro
    expose:
      - "5033"

  web:
    container_name: tijarahjo-web
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_GOOGLE_AUTH_ENABLED: ${VITE_GOOGLE_AUTH_ENABLED:-true}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:?Set VITE_GOOGLE_MAPS_API_KEY}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
    restart: unless-stopped
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - frontend
      - edge
    expose:
      - "80"
    volumes:
      # Behind Nginx Proxy Manager (or similar): HTTP only, no in-container TLS redirects.
      - ./nginx/web.conf.proxy:/etc/nginx/conf.d/default.conf:ro

volumes:
  mssql_data:
  redis_data:
  api_uploads:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  edge:
    external: true
