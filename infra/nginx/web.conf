server {
    listen 80;
    server_name tijarahjo.online www.tijarahjo.online;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Rate limiting zones (applied before server block)
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=5r/s;


# Redirect www → canonical bare domain (HTTPS)
# Must come before the main HTTPS server block so Nginx matches it first.
# This ensures OAuth, cookies, and CSP all operate on a single canonical origin.
server {
    listen 443 ssl;
    http2 on;
    server_name www.tijarahjo.online;

    ssl_certificate     /etc/letsencrypt/live/tijarahjo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tijarahjo.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    return 301 https://tijarahjo.online$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name tijarahjo.online;

    # Hide nginx version from response headers
    server_tokens off;

    # SSL certificates (mounted from host via docker-compose)
    ssl_certificate     /etc/letsencrypt/live/tijarahjo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tijarahjo.online/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed static assets — cache aggressively; filenames change on every build
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Re-add security headers since add_header in a nested block
        # overrides the parent's add_header directives in Nginx
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback — never cache index.html so users always get fresh chunk refs
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        # Re-add security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
    }

    # Backend REST API
    location /api/ {
        client_max_body_size 20M;
        limit_req zone=api_general burst=60 nodelay;

        # Return proper JSON for oversized uploads so the frontend gets a
        # structured error instead of a raw HTML page / "Network Error".
        error_page 413 = @json_413;
        error_page 429 = @json_429;

        proxy_pass http://api:5033/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JSON error responses for Nginx-level rejections (before the request reaches the API)
    location @json_413 {
        internal;
        default_type application/problem+json;
        return 413 '{"type":"https://httpstatuses.com/413","title":"Request Entity Too Large","status":413,"detail":"The uploaded file exceeds the maximum allowed size of 20 MB. Please compress or resize the image and try again."}';
    }

    location @json_429 {
        internal;
        default_type application/problem+json;
        return 429 '{"type":"https://httpstatuses.com/429","title":"Too Many Requests","status":429,"detail":"Too many requests. Please slow down and try again shortly."}';
    }

    # Google OAuth callback — exempt from brute-force rate limiter.
    # Google calls this exactly once per login; rate-limiting it causes silent
    # OAuth failures when the user has made other auth requests recently.
    location = /api/v1/auth/google/callback {
        client_max_body_size 1M;
        proxy_pass http://api:5033/api/v1/auth/google/callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Google OAuth start — also exempt from strict rate limit (user-initiated, once per flow)
    location = /api/v1/auth/google/start {
        client_max_body_size 1M;
        proxy_pass http://api:5033/api/v1/auth/google/start;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stricter rate limit for auth endpoints (brute-force protection)
    location /api/v1/auth/ {
        client_max_body_size 1M;
        limit_req zone=api_auth burst=10 nodelay;

        proxy_pass http://api:5033/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR websocket endpoint
    location /chatHub {
        proxy_pass http://api:5033/chatHub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # Uploaded image files served by API static-file middleware
    location /uploads/ {
        proxy_pass http://api:5033/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
