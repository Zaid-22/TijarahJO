services:
  sqlserver:
    container_name: tijarahjo-db
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your environment}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  redis:
    container_name: tijarahjo-redis
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

volumes:
  mssql_data:
