name: Backend API Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - "infra/docker-compose.yml"
      - "apps/api/**"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "infra/docker-compose.yml"
      - "apps/api/**"

permissions:
  contents: read

jobs:
  backend-api-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
      JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
      DB_APP_PASSWORD: ${{ secrets.DB_APP_PASSWORD }}
      DB_RUNTIME_PRINCIPAL: app
      DB_APP_LOGIN: tijarahjo_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "${MSSQL_SA_PASSWORD:-}" ] || [ -z "${JWT_SIGNING_KEY:-}" ] || [ -z "${DB_APP_PASSWORD:-}" ]; then
            echo "::error::Missing required secrets: MSSQL_SA_PASSWORD, JWT_SIGNING_KEY, and DB_APP_PASSWORD must be configured."
            exit 1
          fi

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Structure compliance check
        run: |
          chmod +x ./scripts/check_structure.sh
          ./scripts/check_structure.sh

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate SQL procedure dedupe guard
        run: |
          chmod +x ./apps/api/database/scripts/guard_no_duplicate_procs.sh
          ./apps/api/database/scripts/guard_no_duplicate_procs.sh

      - name: Validate SQL runtime procedure contract guard
        run: |
          chmod +x ./apps/api/database/scripts/guard_runtime_proc_contract.sh
          ./apps/api/database/scripts/guard_runtime_proc_contract.sh

      - name: Validate migration checksum lock (immutability gate)
        run: |
          chmod +x ./apps/api/database/scripts/guard_migration_checksums.sh
          ./apps/api/database/scripts/guard_migration_checksums.sh

      - name: Validate migration atomicity standards
        run: |
          chmod +x ./apps/api/database/scripts/guard_migration_atomicity.sh
          ./apps/api/database/scripts/guard_migration_atomicity.sh

      - name: Restore backend solution
        run: dotnet restore ./apps/api/TijarahJo.sln

      - name: Build backend solution
        run: dotnet build ./apps/api/TijarahJo.sln -c Release --no-restore

      - name: Run backend unit tests
        run: dotnet test ./apps/api/tests/Api.Tests/TijarahJo.Api.Tests.csproj -c Release --verbosity normal

      - name: Ensure scripts are executable
        run: |
          chmod +x ./scripts/bootstrap_db.sh
          chmod +x ./scripts/verify_all_apis.sh
          chmod +x ./apps/api/tests/contracts/backend_smoke.sh
          chmod +x ./apps/api/tests/contracts/backend_integration_contract.sh
          chmod +x ./apps/api/database/scripts/diagnostics/run_performance_baseline.sh

      - name: Bootstrap DB and backend
        run: CONFIGURATION=Release ./scripts/bootstrap_db.sh --no-verify --keep-backend

      - name: Run backend smoke suite
        run: BASE_URL=http://localhost:5033 ./apps/api/tests/contracts/backend_smoke.sh

      - name: Run backend integration test project
        run: BASE_URL=http://localhost:5033 dotnet test ./apps/api/tests/Integration.Tests/TijarahJo.Integration.Tests.csproj -c Release --no-build --verbosity normal

      - name: Run backend integration contract
        run: BASE_URL=http://localhost:5033 ./apps/api/tests/contracts/backend_integration_contract.sh

      - name: Run full API verification
        run: BASE_URL=http://localhost:5033 ./scripts/verify_all_apis.sh

      - name: Run SQL performance baseline threshold gate
        run: ./apps/api/database/scripts/diagnostics/run_performance_baseline.sh

      - name: Stop backend process
        if: always()
        run: lsof -ti tcp:5033 | xargs -r kill -9 || true
