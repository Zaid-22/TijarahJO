name: Backend API Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bootstrap_db.sh"
      - "verify_all_apis.sh"
      - "docker-compose.yml"
      - "TijarahJo-Backend/**"
  push:
    branches:
      - main
    paths:
      - "bootstrap_db.sh"
      - "verify_all_apis.sh"
      - "docker-compose.yml"
      - "TijarahJo-Backend/**"

permissions:
  contents: read

jobs:
  backend-api-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Ensure scripts are executable
        run: |
          chmod +x ./bootstrap_db.sh
          chmod +x ./verify_all_apis.sh
          chmod +x ./TijarahJo-Backend/TijarahJoDBAPI/tests/backend_smoke.sh

      - name: Bootstrap DB and backend
        run: ./bootstrap_db.sh --no-verify --keep-backend

      - name: Run backend smoke suite
        run: BASE_URL=http://localhost:5033 ./TijarahJo-Backend/TijarahJoDBAPI/tests/backend_smoke.sh

      - name: Run full API verification
        run: BASE_URL=http://localhost:5033 ./verify_all_apis.sh

      - name: Stop backend process
        if: always()
        run: lsof -ti tcp:5033 | xargs -r kill -9 || true
