name: Frontend Backend-Connected Browser E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "scripts/bootstrap_db.sh"
      - "scripts/check_structure.sh"
      - ".github/workflows/frontend-backend-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "scripts/bootstrap_db.sh"
      - "scripts/check_structure.sh"
      - ".github/workflows/frontend-backend-e2e.yml"

permissions:
  contents: read

concurrency:
  group: frontend-backend-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-backend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
      JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
      DB_APP_PASSWORD: ${{ secrets.DB_APP_PASSWORD }}
      DB_RUNTIME_PRINCIPAL: app
      DB_APP_LOGIN: tijarahjo_app
      VITE_API_BASE_URL: http://localhost:5033/api
      E2E_FRONTEND_BASE_URL: http://127.0.0.1:4173
      BACKEND_LOG_FILE: /tmp/tijarahjo_bootstrap_backend.log
      E2E_BACKEND_LOG_FILE: /tmp/tijarahjo_bootstrap_backend.log
      EmailVerification__Enabled: "true"
      EmailVerification__ResendApiKey: ""
      EmailVerification__LogTokensWhenEmailDisabled: "true"
      ImageModeration__Enabled: "false"
      PW_BYPASS_CSP: "0"
      E2E_BACKEND_LIVE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force LF line endings
        run: git config core.autocrlf false && git rm --cached -r . > /dev/null 2>&1 && git reset --hard HEAD

      - name: Validate required secrets
        run: |
          if [ -z "${MSSQL_SA_PASSWORD:-}" ] || [ -z "${JWT_SIGNING_KEY:-}" ] || [ -z "${DB_APP_PASSWORD:-}" ]; then
            echo "::error::Missing required secrets: MSSQL_SA_PASSWORD, JWT_SIGNING_KEY, and DB_APP_PASSWORD must be configured."
            exit 1
          fi

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Structure compliance check
        run: |
          chmod +x ./scripts/check_structure.sh
          ./scripts/check_structure.sh

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Ensure scripts are executable
        run: |
          chmod +x ./scripts/bootstrap_db.sh

      - name: Bootstrap DB and backend
        run: CONFIGURATION=Release ./scripts/bootstrap_db.sh --no-verify --keep-backend

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browser dependencies
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run backend-connected browser journeys
        working-directory: apps/web
        run: npm run test:e2e:backend-live

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-connected-playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-connected-playwright-results
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop backend process
        if: always()
        run: |
          if [ -f .tijarahjo_backend.pid ]; then
            kill "$(cat .tijarahjo_backend.pid)" >/dev/null 2>&1 || true
            rm -f .tijarahjo_backend.pid
          fi
          lsof -ti tcp:5033 | xargs -r kill -9 || true
