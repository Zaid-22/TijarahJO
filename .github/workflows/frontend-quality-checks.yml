name: Frontend Quality Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "TijarahJo-frontend/**"
      - ".github/workflows/frontend-quality-checks.yml"
  push:
    branches:
      - main
    paths:
      - "TijarahJo-frontend/**"
      - ".github/workflows/frontend-quality-checks.yml"

permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: TijarahJo-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "TijarahJo-frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint -- --max-warnings 0

      - name: Run frontend unit tests
        run: npm run test

      - name: Build frontend
        run: npm run build
