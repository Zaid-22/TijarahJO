name: Frontend Quality Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/**"
      - "scripts/check_structure.sh"
      - ".github/workflows/frontend-quality-checks.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "scripts/check_structure.sh"
      - ".github/workflows/frontend-quality-checks.yml"

permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force LF line endings
        run: git config core.autocrlf false && git rm --cached -r . > /dev/null 2>&1 && git reset --hard HEAD

      - name: Structure compliance check
        working-directory: .
        run: |
          chmod +x scripts/check_structure.sh
          ./scripts/check_structure.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend unit tests
        run: npm run test

      - name: Build frontend and enforce bundle budgets
        run: npm run perf:bundle

  frontend-mocked-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CI: "true"
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mocked browser journeys on desktop, tablet, and mobile
        run: npm run test:e2e:browser

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-mocked-browser-e2e-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
